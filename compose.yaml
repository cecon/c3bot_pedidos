services:
  c3bot-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c3bot-web
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_DEV_HOST: 0.0.0.0
    ports:
      - "3920:3920"
      - "3921:3921"
    volumes:
      - .:/app
      - c3bot_node_modules:/app/node_modules
    command: pnpm dev

volumes:
  c3bot_node_modules:
