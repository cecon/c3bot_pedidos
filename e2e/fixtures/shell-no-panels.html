      <nav aria-label="Navegação principal">

        <button aria-label="Atendentes" type="button">Atendentes</button>
      </nav>
      <header><h1>Dashboard</h1></header>
      <main>Shell-only fixture: panels are intentionally absent.</main>
    </div>
  </body>
