[package]
name = "c3bot"
version = "0.1.0"
description = "Desktop WhatsApp commerce agent"
authors = ["C3Bot"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "c3bot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
# Sync SQLite access for the unified, idempotent migration runner (src/migrations.rs).
# Pinned to 0.32 so libsqlite3-sys (0.30) unifies with the version pulled by
# tauri-plugin-sql's sqlx, avoiding a duplicate native sqlite build. See ADR-001.
rusqlite = { version = "0.32", features = ["bundled"] }
